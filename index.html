<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web OBS Lite — Rekam Video</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel2: #2d2d30;
    --border: #3e3e42; --text: #cccccc; --muted: #858585;
    --accent: #007acc; --danger: #f14c4c; --ok: #4ec9b0;
    --warn: #d7ba7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    height: 52px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 12px 0 0; color: #fff; }
  main {
    flex: 1; display: grid;
    grid-template-columns: 260px 1fr 300px; min-height: 0;
  }
  .panel {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }
  .panel-header {
    padding: 6px 10px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
    border-bottom: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  .scroll { overflow-y: auto; flex: 1; min-height: 60px; }
  .scene-item, .source-item, .audio-item {
    padding: 6px 10px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid #2a2a2a;
  }
  .scene-item.active, .source-item.active { background: var(--accent); color: #fff; }
  .source-item button, .audio-item button {
    padding: 1px 5px; font-size: 11px; line-height: 1;
  }
  .preview-area {
    display: flex; align-items: center; justify-content: center;
    background: #111; padding: 16px; min-width: 0; overflow: hidden;
  }
  .canvas-wrap {
    position: relative; width: 100%; max-width: 1280px;
    aspect-ratio: 16 / 9; background: #000;
    box-shadow: 0 0 0 1px #000, 0 10px 30px rgba(0,0,0,.5);
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #3a3a3d; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.warn { background: var(--warn); border-color: var(--warn); color: #1e1e1e; }
  select, input[type="range"] {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 6px; font-size: 12px;
  }
  .add-row {
    display: flex; gap: 6px; padding: 8px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .add-row select { flex: 1; min-width: 0; }
  #status {
    height: 26px; background: var(--panel);
    border-top: 1px solid var(--border); font-size: 11px;
    color: var(--muted); display: flex; align-items: center;
    padding: 0 12px; flex-shrink: 0; gap: 12px;
  }
  #media-pool {
    position: fixed; left: -9999px; top: -9999px;
    width: 1px; height: 1px; overflow: hidden;
    opacity: 0; pointer-events: none;
  }
  .audio-item input[type="range"] { width: 60px; }
  .empty-hint {
    padding: 10px; color: var(--muted); font-size: 12px; line-height: 1.5;
  }
  .rec-controls {
    display: flex; align-items: center; gap: 6px;
    padding: 0 10px;
    border-left: 1px solid var(--border);
    margin-left: 8px;
  }
  #rec-timer {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 13px; color: var(--danger); min-width: 68px;
    font-weight: 600;
  }
  #rec-size {
    font-family: ui-monospace, monospace; font-size: 11px;
    color: var(--muted); min-width: 60px;
  }
  /* Modal */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal.hidden { display: none; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; min-width: 340px;
    max-width: 90vw; max-height: 90vh; overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-box h3 {
    margin: 0 0 16px; font-size: 15px; color: #fff;
  }
  .form-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .form-row label { flex: 0 0 90px; font-size: 12px; color: var(--muted); }
  .form-row select { flex: 1; }
  /* Recordings */
  .recording-item {
    padding: 8px 10px; border-bottom: 1px solid #2a2a2a;
    font-size: 12px;
  }
  .recording-item .rec-title {
    font-weight: 600; color: #fff; margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recording-item .rec-meta {
    color: var(--muted); font-size: 11px; margin-bottom: 6px;
  }
  .recording-item .rec-actions { display: flex; gap: 4px; }
  .recording-item .rec-actions button {
    padding: 2px 8px; font-size: 11px;
  }
  .rec-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 10px; background: var(--danger); color: #fff;
    margin-left: 6px; animation: pulse 1.5s infinite;
  }
  .rec-badge.paused { background: var(--warn); animation: none; }
  @keyframes pulse { 50% { opacity: .5; } }
</style>
</head>
<body>

<header>
  <h1>🎬 Web OBS Lite</h1>

  <div class="rec-controls">
    <button id="record-btn" class="primary">● Rekam</button>
    <button id="pause-btn" style="display:none">⏸ Jeda</button>
    <button id="stop-btn" style="display:none" class="danger">■ Stop</button>
    <span id="rec-timer"></span>
    <span id="rec-size"></span>
  </div>

  <button id="rec-settings-btn" title="Pengaturan rekaman">⚙</button>
  <button id="live-btn">🌐 Siaran</button>
  <span style="flex:1"></span>
  <span style="font-size:11px;color:var(--muted)">Chrome / Edge • localhost atau HTTPS</span>
</header>

<main>
  <aside class="panel">
    <div class="panel-header">
      <span>Scenes</span>
      <button id="add-scene-btn">+</button>
    </div>
    <div id="scenes-list" class="scroll" style="flex:1"></div>
  </aside>

  <section class="preview-area">
    <div class="canvas-wrap">
      <canvas id="preview" width="1280" height="720"></canvas>
    </div>
  </section>

  <aside class="panel">
    <div class="panel-header"><span>Sources</span></div>
    <div class="add-row">
      <select id="source-type-select">
        <option value="webcam">Webcam</option>
        <option value="screen">Screen Capture</option>
        <option value="videofile">Video File (MP4/WebM)</option>
        <option value="image">Gambar (URL)</option>
        <option value="text">Teks</option>
        <option value="color">Warna Solid</option>
        <option value="mic">Mikrofon</option>
      </select>
      <button id="add-source-btn" class="primary">Tambah</button>
    </div>
    <div id="sources-list" class="scroll" style="flex:1.2"></div>

    <div class="panel-header">
      <span>Audio Mixer</span>
      <button id="monitor-toggle" title="Monitor audio ke speaker" style="font-size:10px;padding:1px 6px">🔇 Monitor</button>
    </div>
    <div id="audio-list" class="scroll" style="flex:1"></div>

    <div class="panel-header">
      <span>Rekaman</span>
      <span id="rec-count" style="color:var(--accent)">0</span>
    </div>
    <div id="recordings-list" class="scroll" style="flex:1.2"></div>
  </aside>
</main>

<div id="status"></div>
<div id="media-pool"></div>

<!-- Modal Pengaturan Rekaman -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box">
    <h3>⚙ Pengaturan Rekaman</h3>
    <div class="form-row">
      <label>Format</label>
      <select id="cfg-mime">
        <option value="auto">Otomatis (WebM VP9)</option>
        <option value="video/webm;codecs=vp9">WebM VP9 (kompresi bagus)</option>
        <option value="video/webm;codecs=vp8">WebM VP8 (kompatibel)</option>
        <option value="video/webm;codecs=h264">WebM H.264</option>
        <option value="video/mp4">MP4 (jika didukung browser)</option>
      </select>
    </div>
    <div class="form-row">
      <label>Kualitas</label>
      <select id="cfg-quality">
        <option value="2000000">Rendah — 2 Mbps</option>
        <option value="4000000">Sedang — 4 Mbps</option>
        <option value="6000000" selected>Tinggi — 6 Mbps</option>
        <option value="12000000">Ultra — 12 Mbps</option>
      </select>
    </div>
    <div class="form-row">
      <label>FPS</label>
      <select id="cfg-fps">
        <option value="24">24 FPS</option>
        <option value="30" selected>30 FPS</option>
        <option value="60">60 FPS</option>
      </select>
    </div>
    <div style="font-size:11px;color:var(--muted);margin:12px 0">
      File akan otomatis tersimpan di panel <b>Rekaman</b>. Klik ⬇ untuk download.
    </div>
    <div style="text-align:right">
      <button id="settings-close" class="primary">Tutup</button>
    </div>
  </div>
</div>

<!-- Modal Preview Rekaman -->
<div id="preview-modal" class="modal hidden">
  <div class="modal-box" style="min-width:600px">
    <video id="preview-video" controls playsinline style="width:100%;max-height:60vh;background:#000;border-radius:4px"></video>
    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
      <span id="preview-info" style="font-size:12px;color:var(--muted)"></span>
      <button id="preview-close" class="primary">Tutup</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   STATE
   ========================================================= */
const state = {
  scenes: [],
  activeSceneId: null,
  selectedSourceId: null,
  audioContext: null,
  masterGain: null,
  monitorGain: null,
  monitorOn: false,
  audioDestination: null,
  // Recording
  recording: false,
  recPaused: false,
  recStartTime: 0,
  recPausedTotal: 0,
  recPausedAt: 0,
  recTimerInterval: null,
  currentRecSize: 0,
  currentRecDuration: 0,
  mediaRecorder: null,
  recordedChunks: [],
  recMime: 'video/webm;codecs=vp9',
  recBitrate: 6_000_000,
  recFps: 30,
  // WHIP
  whipPc: null,
  isLive: false,
  // Rendering
  drawTimer: null,
};

const recordings = []; // {id, name, blob, url, size, duration, timestamp}
let _id = 0;
const uid = (p = 'id') => `${p}-${++_id}-${Date.now().toString(36)}`;

/* =========================================================
   DOM
   ========================================================= */
const canvas = document.getElementById('preview');
const ctx = canvas.getContext('2d');
const scenesListEl = document.getElementById('scenes-list');
const sourcesListEl = document.getElementById('sources-list');
const audioListEl = document.getElementById('audio-list');
const recordingsListEl = document.getElementById('recordings-list');
const recCountEl = document.getElementById('rec-count');
const sourceTypeSelect = document.getElementById('source-type-select');
const addSourceBtn = document.getElementById('add-source-btn');
const addSceneBtn = document.getElementById('add-scene-btn');
const recordBtn = document.getElementById('record-btn');
const pauseBtn = document.getElementById('pause-btn');
const stopBtn = document.getElementById('stop-btn');
const recTimerEl = document.getElementById('rec-timer');
const recSizeEl = document.getElementById('rec-size');
const recSettingsBtn = document.getElementById('rec-settings-btn');
const settingsModal = document.getElementById('settings-modal');
const previewModal = document.getElementById('preview-modal');
const previewVideo = document.getElementById('preview-video');
const previewInfo = document.getElementById('preview-info');
const liveBtn = document.getElementById('live-btn');
const statusEl = document.getElementById('status');
const mediaPool = document.getElementById('media-pool');
const monitorToggle = document.getElementById('monitor-toggle');

/* =========================================================
   UTILITY
   ========================================================= */
function formatDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const hh = String(Math.floor(total / 3600)).padStart(2, '0');
  const mm = String(Math.floor((total % 3600) / 60)).padStart(2, '0');
  const ss = String(total % 60).padStart(2, '0');
  return `${hh}:${mm}:${ss}`;
}
function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

/* =========================================================
   AUDIO GRAPH
   ========================================================= */
function ensureAudioContext() {
  if (!state.audioContext) {
    state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    state.masterGain = state.audioContext.createGain();
    state.audioDestination = state.audioContext.createMediaStreamDestination();
    state.monitorGain = state.audioContext.createGain();
    state.monitorGain.gain.value = 0;
    state.masterGain.connect(state.audioDestination);
    state.masterGain.connect(state.monitorGain);
    state.monitorGain.connect(state.audioContext.destination);
  }
  if (state.audioContext.state === 'suspended') state.audioContext.resume();
}

monitorToggle.onclick = () => {
  ensureAudioContext();
  state.monitorOn = !state.monitorOn;
  state.monitorGain.gain.value = state.monitorOn ? 1 : 0;
  monitorToggle.textContent = state.monitorOn ? '🔊 Monitor' : '🔇 Monitor';
  monitorToggle.classList.toggle('primary', state.monitorOn);
};

function connectAudioTrack(src, track) {
  ensureAudioContext();
  const stream = new MediaStream([track]);
  const srcNode = state.audioContext.createMediaStreamSource(stream);
  const gain = state.audioContext.createGain();
  gain.gain.value = src.muted ? 0 : src.volume;
  srcNode.connect(gain).connect(state.masterGain);
  src.gainNode = gain;
  src.audioTrack = track;
}

function renderAudioMixer() {
  audioListEl.innerHTML = '';
  const scene = getActiveScene();
  if (!scene) return;
  const audioSources = scene.sources.filter(s => s.gainNode || s.type === 'mic');
  if (!audioSources.length) {
    audioListEl.innerHTML = '<div class="empty-hint">Belum ada sumber audio.</div>';
    return;
  }
  audioSources.forEach(src => {
    const div = document.createElement('div');
    div.className = 'audio-item';

    const name = document.createElement('span');
    name.textContent = src.name;
    name.style.flex = '1';
    name.style.overflow = 'hidden';
    name.style.textOverflow = 'ellipsis';
    name.style.whiteSpace = 'nowrap';

    const mute = document.createElement('button');
    mute.textContent = src.muted ? '🔇' : '🔊';
    mute.onclick = () => {
      src.muted = !src.muted;
      if (src.gainNode) src.gainNode.gain.value = src.muted ? 0 : src.volume;
      renderAudioMixer();
    };

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '0'; slider.max = '1'; slider.step = '0.01';
    slider.value = src.volume;
    slider.oninput = () => {
      src.volume = parseFloat(slider.value);
      if (!src.muted && src.gainNode) src.gainNode.gain.value = src.volume;
    };

    div.append(name, mute, slider);
    audioListEl.appendChild(div);
  });
}

/* =========================================================
   SCENES
   ========================================================= */
function createScene(name) {
  return { id: uid('scene'), name, background: '#000000', sources: [] };
}
function getActiveScene() {
  return state.scenes.find(s => s.id === state.activeSceneId);
}
function renderScenes() {
  scenesListEl.innerHTML = '';
  state.scenes.forEach(scene => {
    const div = document.createElement('div');
    div.className = 'scene-item' + (scene.id === state.activeSceneId ? ' active' : '');
    div.textContent = scene.name;
    div.onclick = () => {
      state.activeSceneId = scene.id;
      state.selectedSourceId = null;
      renderScenes(); renderSources(); renderAudioMixer();
    };
    scenesListEl.appendChild(div);
  });
}
addSceneBtn.onclick = () => {
  const name = prompt('Nama scene baru:', `Scene ${state.scenes.length + 1}`);
  if (!name || !name.trim()) return;
  const scene = createScene(name.trim());
  state.scenes.push(scene);
  state.activeSceneId = scene.id;
  state.selectedSourceId = null;
  renderScenes(); renderSources(); renderAudioMixer();
};

/* =========================================================
   SOURCES
   ========================================================= */
async function createWebcamSource() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }
  const video = document.createElement('video');
  video.srcObject = stream; video.muted = true;
  video.playsInline = true; video.autoplay = true;
  mediaPool.appendChild(video);
  await video.play();

  const src = {
    id: uid('src'), type: 'webcam', name: 'Webcam',
    visible: true, x: 40, y: 40, width: 640, height: 360,
    videoEl: video, stream, gainNode: null, volume: 1, muted: false,
  };
  const audioTracks = stream.getAudioTracks();
  if (audioTracks.length) connectAudioTrack(src, audioTracks[0]);
  return src;
}

async function createScreenSource() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  }
  const video = document.createElement('video');
  video.srcObject = stream; video.muted = true;
  video.playsInline = true; video.autoplay = true;
  mediaPool.appendChild(video);
  await video.play();

  const src = {
    id: uid('src'), type: 'screen', name: 'Screen Capture',
    visible: true, x: 80, y: 60, width: 960, height: 540,
    videoEl: video, stream, gainNode: null, volume: 1, muted: false,
  };
  const audioTracks = stream.getAudioTracks();
  if (audioTracks.length) connectAudioTrack(src, audioTracks[0]);

  const videoTrack = stream.getVideoTracks()[0];
  if (videoTrack) {
    videoTrack.addEventListener('ended', () => {
      src.visible = false; renderSources();
    });
  }
  return src;
}

function pickVideoFile() {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'video/*';
    input.onchange = () => {
      if (input.files[0]) resolve({ file: input.files[0], url: URL.createObjectURL(input.files[0]) });
      else resolve(null);
    };
    input.click();
  });
}

async function createVideoFileSource() {
  let videoUrl, fileName;
  const useFile = confirm('OK = pilih file dari komputer\nCancel = masukkan URL video');
  if (useFile) {
    const picked = await pickVideoFile();
    if (!picked) return null;
    videoUrl = picked.url;
    fileName = picked.file.name;
  } else {
    videoUrl = prompt('URL video (MP4/WebM):');
    if (!videoUrl) return null;
    fileName = videoUrl.split('/').pop().split('?')[0] || 'video';
  }

  const video = document.createElement('video');
  video.src = videoUrl;
  video.loop = true;
  video.playsInline = true;
  video.crossOrigin = 'anonymous';
  video.muted = false;
  mediaPool.appendChild(video);

  await new Promise((resolve) => {
    video.onloadedmetadata = resolve;
    video.onerror = resolve;
    setTimeout(resolve, 5000);
  });

  try { await video.play(); } catch (e) { console.warn('Autoplay gagal:', e); }

  // Route audio via Web Audio
  ensureAudioContext();
  let gain = null;
  try {
    const srcNode = state.audioContext.createMediaElementSource(video);
    gain = state.audioContext.createGain();
    gain.gain.value = 1;
    srcNode.connect(gain).connect(state.masterGain);
  } catch (e) {
    console.warn('Routing audio video gagal:', e);
  }

  // Calculate aspect-ratio-fitting size
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 360;
  const maxW = 800, maxH = 450;
  const ratio = Math.min(maxW / vw, maxH / vh, 1);
  const width = Math.round(vw * ratio);
  const height = Math.round(vh * ratio);

  const src = {
    id: uid('src'), type: 'videofile',
    name: '📹 ' + fileName.slice(0, 24),
    visible: true,
    x: Math.round((canvas.width - width) / 2),
    y: Math.round((canvas.height - height) / 2),
    width, height,
    videoEl: video, gainNode: gain,
    volume: 1, muted: false, url: videoUrl,
  };

  video.addEventListener('play', () => renderSources());
  video.addEventListener('pause', () => renderSources());

  return src;
}

function createImageSource() {
  const url = prompt('URL gambar (CORS-enabled):');
  if (!url) return null;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = url;

  const src = {
    id: uid('src'), type: 'image', name: 'Gambar',
    visible: true, x: 100, y: 100, width: 400, height: 300,
    imgEl: img, volume: 1, muted: false,
  };
  img.onload = () => {
    const maxW = 640, maxH = 360;
    const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    src.width = Math.round(img.naturalWidth * ratio);
    src.height = Math.round(img.naturalHeight * ratio);
  };
  return src;
}

function createTextSource() {
  const text = prompt('Isi teks:', 'Teks OBS Web');
  if (!text) return null;
  return {
    id: uid('src'), type: 'text', name: 'Teks: ' + text.slice(0, 24),
    visible: true, x: 80, y: 80, width: 400, height: 100,
    text, color: '#ffffff', font: '48px sans-serif',
    volume: 1, muted: false,
  };
}

function createColorSource() {
  const color = prompt('Warna (hex):', '#ff0000');
  if (!color) return null;
  return {
    id: uid('src'), type: 'color', name: 'Warna ' + color,
    visible: true, x: 200, y: 150, width: 400, height: 300,
    color, volume: 1, muted: false,
  };
}

async function createMicSource() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const src = {
    id: uid('src'), type: 'mic', name: 'Mikrofon',
    visible: true, x: 0, y: 0, width: 0, height: 0,
    stream, gainNode: null, volume: 1, muted: false,
  };
  connectAudioTrack(src, stream.getAudioTracks()[0]);
  return src;
}

async function addSource(type) {
  const scene = getActiveScene();
  if (!scene) return;
  let src;
  if (type === 'webcam') src = await createWebcamSource();
  else if (type === 'screen') src = await createScreenSource();
  else if (type === 'videofile') src = await createVideoFileSource();
  else if (type === 'image') src = createImageSource();
  else if (type === 'text') src = createTextSource();
  else if (type === 'color') src = createColorSource();
  else if (type === 'mic') src = await createMicSource();
  if (!src) return;
  scene.sources.push(src);
  state.selectedSourceId = src.id;
  renderSources(); renderAudioMixer();
}

addSourceBtn.onclick = async () => {
  try { await addSource(sourceTypeSelect.value); }
  catch (err) { alert('Gagal menambahkan sumber: ' + err.message); }
};

function cleanupSource(src) {
  if (src.stream) src.stream.getTracks().forEach(t => t.stop());
  if (src.gainNode) { try { src.gainNode.disconnect(); } catch {} }
  if (src.videoEl) {
    try { src.videoEl.pause(); src.videoEl.srcObject = null; src.videoEl.removeAttribute('src'); src.videoEl.load(); } catch {}
    src.videoEl.remove();
  }
  if (src.type === 'videofile' && src.url && src.url.startsWith('blob:')) {
    try { URL.revokeObjectURL(src.url); } catch {}
  }
}

function removeSource(id) {
  const scene = getActiveScene();
  if (!scene) return;
  const idx = scene.sources.findIndex(s => s.id === id);
  if (idx === -1) return;
  cleanupSource(scene.sources[idx]);
  scene.sources.splice(idx, 1);
  if (state.selectedSourceId === id) state.selectedSourceId = null;
  renderSources(); renderAudioMixer();
}

function moveSource(index, delta) {
  const scene = getActiveScene();
  if (!scene) return;
  const newIndex = index + delta;
  if (newIndex < 0 || newIndex >= scene.sources.length) return;
  const [item] = scene.sources.splice(index, 1);
  scene.sources.splice(newIndex, 0, item);
  renderSources();
}

function renderSources() {
  sourcesListEl.innerHTML = '';
  const scene = getActiveScene();
  if (!scene) return;
  if (!scene.sources.length) {
    sourcesListEl.innerHTML = '<div class="empty-hint">Belum ada source.<br>Gunakan panel di atas.</div>';
    return;
  }
  scene.sources.forEach((src, idx) => {
    const div = document.createElement('div');
    div.className = 'source-item' + (src.id === state.selectedSourceId ? ' active' : '');

    const eye = document.createElement('button');
    eye.textContent = src.visible ? '👁' : '🚫';
    eye.onclick = (e) => { e.stopPropagation(); src.visible = !src.visible; renderSources(); };

    const label = document.createElement('span');
    label.textContent = src.name;
    label.style.flex = '1';
    label.style.overflow = 'hidden';
    label.style.textOverflow = 'ellipsis';
    label.style.whiteSpace = 'nowrap';

    div.append(eye, label);

    // Play/pause for video files
    if (src.type === 'videofile') {
      const playBtn = document.createElement('button');
      playBtn.textContent = src.videoEl.paused ? '▶' : '⏸';
      playBtn.title = 'Play/Pause';
      playBtn.onclick = (e) => {
        e.stopPropagation();
        if (src.videoEl.paused) src.videoEl.play().catch(()=>{});
        else src.videoEl.pause();
      };
      div.appendChild(playBtn);
    }

    const up = document.createElement('button');
    up.textContent = '▲'; up.title = 'Naik';
    up.onclick = (e) => { e.stopPropagation(); moveSource(idx, -1); };
    const down = document.createElement('button');
    down.textContent = '▼'; down.title = 'Turun';
    down.onclick = (e) => { e.stopPropagation(); moveSource(idx, 1); };
    const del = document.createElement('button');
    del.textContent = '✕'; del.title = 'Hapus';
    del.onclick = (e) => { e.stopPropagation(); removeSource(src.id); };

    div.append(up, down, del);
    div.onclick = () => { state.selectedSourceId = src.id; renderSources(); };
    sourcesListEl.appendChild(div);
  });
}

/* =========================================================
   CANVAS RENDER
   ========================================================= */
function drawFrame() {
  const scene = getActiveScene();
  ctx.fillStyle = scene ? scene.background : '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!scene) return;

  for (const src of scene.sources) {
    if (!src.visible) continue;
    ctx.save();
    if (src.type === 'webcam' || src.type === 'screen' || src.type === 'videofile') {
      if (src.videoEl && src.videoEl.readyState >= 2 && src.videoEl.videoWidth > 0) {
        try { ctx.drawImage(src.videoEl, src.x, src.y, src.width, src.height); } catch {}
      }
    } else if (src.type === 'image') {
      if (src.imgEl && src.imgEl.complete && src.imgEl.naturalWidth) {
        ctx.drawImage(src.imgEl, src.x, src.y, src.width, src.height);
      }
    } else if (src.type === 'text') {
      ctx.font = src.font;
      ctx.fillStyle = src.color;
      ctx.textBaseline = 'top';
      ctx.fillText(src.text, src.x, src.y, src.width);
    } else if (src.type === 'color') {
      ctx.fillStyle = src.color;
      ctx.fillRect(src.x, src.y, src.width, src.height);
    }
    ctx.restore();
  }
  drawSelection();
}

function drawSelection() {
  const scene = getActiveScene();
  if (!scene || !state.selectedSourceId) return;
  const src = scene.sources.find(s => s.id === state.selectedSourceId);
  if (!src || !src.visible || src.type === 'mic') return;
  ctx.save();
  ctx.strokeStyle = '#00aaff';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(src.x, src.y, src.width, src.height);
  ctx.setLineDash([]);
  ctx.fillStyle = '#00aaff';
  ctx.fillRect(src.x + src.width - 8, src.y + src.height - 8, 12, 12);
  ctx.restore();
}

/* =========================================================
   DRAG & RESIZE
   ========================================================= */
let interaction = null;

function getCanvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height),
  };
}
function isInsideSource(pt, src) {
  return pt.x >= src.x && pt.x <= src.x + src.width &&
         pt.y >= src.y && pt.y <= src.y + src.height;
}
function isNearResizeHandle(pt, src) {
  const hx = src.x + src.width, hy = src.y + src.height;
  return Math.abs(pt.x - hx) <= 14 && Math.abs(pt.y - hy) <= 14;
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const pt = getCanvasPoint(e);
  const scene = getActiveScene();
  if (!scene) return;
  for (let i = scene.sources.length - 1; i >= 0; i--) {
    const src = scene.sources[i];
    if (!src.visible || src.type === 'mic') continue;
    if (isNearResizeHandle(pt, src)) {
      state.selectedSourceId = src.id;
      interaction = { type: 'resize', src, start: pt, origW: src.width, origH: src.height };
      renderSources(); e.preventDefault(); return;
    }
    if (isInsideSource(pt, src)) {
      state.selectedSourceId = src.id;
      interaction = { type: 'drag', src, start: pt, origX: src.x, origY: src.y };
      renderSources(); e.preventDefault(); return;
    }
  }
  state.selectedSourceId = null;
  renderSources();
});
window.addEventListener('pointermove', (e) => {
  if (!interaction) return;
  const pt = getCanvasPoint(e);
  const src = interaction.src;
  if (interaction.type === 'drag') {
    src.x = Math.round(interaction.origX + (pt.x - interaction.start.x));
    src.y = Math.round(interaction.origY + (pt.y - interaction.start.y));
    src.x = Math.max(-src.width + 20, Math.min(canvas.width - 20, src.x));
    src.y = Math.max(-src.height + 20, Math.min(canvas.height - 20, src.y));
  } else if (interaction.type === 'resize') {
    src.width = Math.max(40, Math.round(interaction.origW + (pt.x - interaction.start.x)));
    src.height = Math.max(40, Math.round(interaction.origH + (pt.y - interaction.start.y)));
  }
});
window.addEventListener('pointerup', () => { interaction = null; });

/* =========================================================
   RECORDING — Enhanced
   ========================================================= */
function pickSupportedMime(pref) {
  if (pref === 'auto') {
    const order = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
      'video/mp4',
    ];
    for (const m of order) if (MediaRecorder.isTypeSupported(m)) return m;
    return 'video/webm';
  }
  if (MediaRecorder.isTypeSupported(pref)) return pref;
  // Fallback
  for (const m of ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']) {
    if (MediaRecorder.isTypeSupported(m)) return m;
  }
  return 'video/webm';
}

function getRecordingStream() {
  const canvasStream = canvas.captureStream(state.recFps);
  const tracks = [...canvasStream.getVideoTracks()];
  if (state.audioDestination) {
    tracks.push(...state.audioDestination.stream.getAudioTracks());
  }
  return new MediaStream(tracks);
}

function updateRecTimerDisplay() {
  let elapsed = Date.now() - state.recStartTime - state.recPausedTotal;
  if (state.recPausedAt) elapsed -= (Date.now() - state.recPausedAt);
  recTimerEl.textContent = formatDuration(elapsed);
  recSizeEl.textContent = formatBytes(state.currentRecSize);
}

function startRecTimer() {
  state.recStartTime = Date.now();
  state.recPausedTotal = 0;
  state.recPausedAt = 0;
  state.currentRecSize = 0;
  state.recTimerInterval = setInterval(updateRecTimerDisplay, 200);
  updateRecTimerDisplay();
}
function stopRecTimer() {
  if (state.recTimerInterval) {
    clearInterval(state.recTimerInterval);
    state.recTimerInterval = null;
  }
  recTimerEl.textContent = '';
  recSizeEl.textContent = '';
}

function updateRecButtons() {
  if (!state.recording) {
    recordBtn.style.display = '';
    pauseBtn.style.display = 'none';
    stopBtn.style.display = 'none';
    recordBtn.textContent = '● Rekam';
    recordBtn.classList.add('primary');
    recordBtn.classList.remove('danger');
    recordBtn.disabled = false;
  } else {
    recordBtn.style.display = 'none';
    pauseBtn.style.display = '';
    stopBtn.style.display = '';
    pauseBtn.textContent = state.recPaused ? '▶ Lanjut' : '⏸ Jeda';
    pauseBtn.classList.toggle('primary', state.recPaused);
  }
}

async function startRecording() {
  if (state.recording) return;
  if (!canvas.captureStream) {
    alert('Browser tidak mendukung canvas.captureStream(). Gunakan Chrome/Edge terbaru.');
    return;
  }
  ensureAudioContext();
  await state.audioContext.resume();

  const stream = getRecordingStream();
  const mime = pickSupportedMime(state.recMime);

  let recorder;
  try {
    recorder = new MediaRecorder(stream, {
      mimeType: mime,
      videoBitsPerSecond: state.recBitrate,
    });
  } catch (err) {
    alert('MediaRecorder gagal: ' + err.message);
    return;
  }

  state.mediaRecorder = recorder;
  state.recordedChunks = [];
  state.currentRecSize = 0;

  recorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) {
      state.recordedChunks.push(e.data);
      state.currentRecSize += e.data.size;
    }
  };

  recorder.onstop = () => {
    const duration = Date.now() - state.recStartTime - state.recPausedTotal;
    const blob = new Blob(state.recordedChunks, { type: mime.split(';')[0] });
    const url = URL.createObjectURL(blob);

    // Auto file name & extension
    const ext = mime.includes('mp4') ? 'mp4' : 'webm';
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const name = `rekaman-${stamp}.${ext}`;

    const rec = {
      id: uid('rec'),
      name,
      blob, url,
      size: blob.size,
      duration,
      timestamp: Date.now(),
      mime,
    };
    recordings.push(rec);
    renderRecordings();

    // Auto-download
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();

    // Cleanup state
    state.recording = false;
    state.recPaused = false;
    state.currentRecSize = 0;
    stopRecTimer();
    updateRecButtons();
    updateStatus();
  };

  recorder.start(1000); // chunk every 1s
  state.recording = true;
  state.recPaused = false;
  startRecTimer();
  updateRecButtons();
  updateStatus();
}

function pauseRecording() {
  if (!state.mediaRecorder || state.mediaRecorder.state !== 'recording') return;
  try {
    state.mediaRecorder.pause();
    state.recPausedAt = Date.now();
    state.recPaused = true;
    updateRecButtons();
    updateStatus();
  } catch (e) { console.warn(e); }
}

function resumeRecording() {
  if (!state.mediaRecorder || state.mediaRecorder.state !== 'paused') return;
  try {
    state.mediaRecorder.resume();
    if (state.recPausedAt) {
      state.recPausedTotal += Date.now() - state.recPausedAt;
      state.recPausedAt = 0;
    }
    state.recPaused = false;
    updateRecButtons();
    updateStatus();
  } catch (e) { console.warn(e); }
}

function stopRecording() {
  if (!state.mediaRecorder) return;
  if (state.mediaRecorder.state !== 'inactive') {
    state.mediaRecorder.stop();
  }
}

/* =========================================================
   RECORDINGS LIBRARY
   ========================================================= */
function renderRecordings() {
  recordingsListEl.innerHTML = '';
  recCountEl.textContent = recordings.length;
  if (!recordings.length) {
    recordingsListEl.innerHTML = '<div class="empty-hint">Belum ada rekaman.<br>Klik <b>● Rekam</b> di header.</div>';
    return;
  }
  // Reverse: terbaru di atas
  [...recordings].reverse().forEach(rec => {
    const div = document.createElement('div');
    div.className = 'recording-item';

    const title = document.createElement('div');
    title.className = 'rec-title';
    title.textContent = '📹 ' + rec.name;

    const meta = document.createElement('div');
    meta.className = 'rec-meta';
    meta.textContent = `${formatDuration(rec.duration)} • ${formatBytes(rec.size)} • ${rec.mime.split(';')[0].replace('video/', '').toUpperCase()}`;

    const actions = document.createElement('div');
    actions.className = 'rec-actions';

    const playBtn = document.createElement('button');
    playBtn.textContent = '▶ Preview';
    playBtn.classList.add('primary');
    playBtn.onclick = () => openPreview(rec);

    const dlBtn = document.createElement('button');
    dlBtn.textContent = '⬇ Download';
    dlBtn.onclick = () => downloadRecording(rec);

    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.classList.add('danger');
    delBtn.title = 'Hapus rekaman';
    delBtn.onclick = () => deleteRecording(rec.id);

    actions.append(playBtn, dlBtn, delBtn);
    div.append(title, meta, actions);
    recordingsListEl.appendChild(div);
  });
}

function openPreview(rec) {
  previewVideo.src = rec.url;
  previewVideo.load();
  previewInfo.textContent = `${rec.name} • ${formatDuration(rec.duration)} • ${formatBytes(rec.size)}`;
  previewModal.classList.remove('hidden');
  previewVideo.play().catch(()=>{});
}

function downloadRecording(rec) {
  const a = document.createElement('a');
  a.href = rec.url;
  a.download = rec.name;
  a.click();
}

function deleteRecording(id) {
  const idx = recordings.findIndex(r => r.id === id);
  if (idx === -1) return;
  if (!confirm('Hapus rekaman ini?')) return;
  try { URL.revokeObjectURL(recordings[idx].url); } catch {}
  recordings.splice(idx, 1);
  renderRecordings();
}

/* =========================================================
   BUTTON HANDLERS
   ========================================================= */
recordBtn.onclick = () => { if (!state.recording) startRecording(); };
pauseBtn.onclick = () => { if (state.recPaused) resumeRecording(); else pauseRecording(); };
stopBtn.onclick = () => { stopRecording(); };

recSettingsBtn.onclick = () => settingsModal.classList.remove('hidden');
document.getElementById('settings-close').onclick = () => settingsModal.classList.add('hidden');

document.getElementById('cfg-mime').onchange = (e) => { state.recMime = e.target.value; };
document.getElementById('cfg-quality').onchange = (e) => { state.recBitrate = parseInt(e.target.value); };
document.getElementById('cfg-fps').onchange = (e) => { state.recFps = parseInt(e.target.value); };

document.getElementById('preview-close').onclick = () => {
  previewVideo.pause();
  previewVideo.removeAttribute('src');
  previewModal.classList.add('hidden');
};
previewModal.addEventListener('click', (e) => {
  if (e.target === previewModal) {
    previewVideo.pause();
    previewModal.classList.add('hidden');
  }
});

/* =========================================================
   WHIP
   ========================================================= */
async function startWHIP(endpoint) {
  if (state.whipPc) { alert('Siaran sudah aktif.'); return; }
  ensureAudioContext();
  await state.audioContext.resume();
  const stream = getRecordingStream();
  const pc = new RTCPeerConnection();
  stream.getTracks().forEach(track => pc.addTrack(track, stream));
  state.whipPc = pc;

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') return resolve();
    const check = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 5000);
  });
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/sdp' },
    body: pc.localDescription.sdp,
  });
  if (!res.ok) throw new Error('WHIP endpoint menolak: ' + res.status);
  const answer = await res.text();
  await pc.setRemoteDescription({ type: 'answer', sdp: answer });
  state.isLive = true;
  liveBtn.textContent = '■ Stop Siaran';
  liveBtn.classList.add('danger');
}
function stopWHIP() {
  if (state.whipPc) { try { state.whipPc.close(); } catch {} state.whipPc = null; }
  state.isLive = false;
  liveBtn.textContent = '🌐 Siaran';
  liveBtn.classList.remove('danger');
}
liveBtn.onclick = async () => {
  if (state.isLive) { stopWHIP(); return; }
  const endpoint = prompt('WHIP endpoint (contoh: https://server/whip):');
  if (!endpoint) return;
  try { await startWHIP(endpoint); }
  catch (err) { alert('Gagal siaran: ' + err.message); stopWHIP(); }
};

/* =========================================================
   STATUS
   ========================================================= */
function updateStatus() {
  const scene = getActiveScene();
  const audioCount = scene ? scene.sources.filter(s => s.gainNode || s.type === 'mic').length : 0;
  let recText = '';
  if (state.recording) {
    recText = state.recPaused ? ' | ⏸ REC PAUSED' : ' | ● REC';
  }
  statusEl.textContent =
    `Scene: ${scene?.name || '-'}  |  ${canvas.width}x${canvas.height} @${state.recFps}fps  |  Audio: ${audioCount}  |  Rekaman: ${recordings.length}${recText}`;
}
setInterval(updateStatus, 1000);

/* =========================================================
   INIT
   ========================================================= */
function init() {
  const scene = createScene('Scene 1');
  state.scenes.push(scene);
  state.activeSceneId = scene.id;
  renderScenes();
  renderSources();
  renderAudioMixer();
  renderRecordings();
  drawFrame();
  state.drawTimer = setInterval(drawFrame, 1000 / 30);
  updateStatus();
}

window.addEventListener('beforeunload', () => {
  state.scenes.forEach(s => s.sources.forEach(cleanupSource));
  if (state.whipPc) { try { state.whipPc.close(); } catch {} }
  if (state.audioContext) { try { state.audioContext.close(); } catch {} }
  recordings.forEach(r => { try { URL.revokeObjectURL(r.url); } catch {} });
});

init();
</script>
