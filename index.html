<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Filter &amp; Extract Excel — TAP 1 / TAP 2</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#ffffff; --soft:#f1f5f9; --line:#e2e8f0;
    --txt:#0f172a; --muted:#64748b;
    --brand:#2563eb; --brand2:#1d4ed8; --ok:#059669;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Segoe UI",Inter,Roboto,system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#0f172a 0%,#1e293b 220px,#f1f5f9 220px,#f1f5f9 100%);
    color:var(--txt); min-height:100vh;
  }
  .wrap{max-width:1500px;margin:0 auto;padding:26px 20px 60px}

  header.top{color:#fff;margin-bottom:22px}
  header.top h1{margin:0 0 6px;font-size:22px;letter-spacing:.2px}
  header.top p{margin:0;color:#cbd5e1;font-size:13.5px}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;margin:0 0 -1px;position:relative;z-index:3}
  .tab{
    padding:11px 26px;border-radius:12px 12px 0 0;font-size:13.5px;font-weight:600;
    background:rgba(255,255,255,.14);color:#e2e8f0;cursor:pointer;
    border:1px solid transparent;border-bottom:none;transition:.18s;user-select:none;
  }
  .tab:hover{background:rgba(255,255,255,.24)}
  .tab.active{background:#f1f5f9;color:var(--brand2);border-color:var(--line);cursor:default}
  .tab .badge{
    display:inline-block;margin-left:8px;font-size:10.5px;background:#e2e8f0;color:#475569;
    padding:2px 7px;border-radius:999px;font-weight:700;letter-spacing:.3px;
  }
  .tab.active .badge{background:#dbeafe;color:var(--brand2)}

  .panel-wrap{background:transparent}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(15,23,42,.08);padding:20px;margin-bottom:18px;
  }
  .card h2{margin:0 0 4px;font-size:15px}
  .card .sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}

  /* ---------- Upload ---------- */
  .drop{
    border:2px dashed #cbd5e1;border-radius:14px;padding:34px 20px;text-align:center;
    background:#f8fafc;transition:.18s;cursor:pointer;display:block;
  }
  .drop:hover,.drop.over{border-color:var(--brand);background:#eff6ff}
  .drop .ico{font-size:34px;line-height:1;margin-bottom:10px}
  .drop b{display:block;font-size:14.5px;margin-bottom:4px}
  .drop span{font-size:12.5px;color:var(--muted)}
  input[type=file]{display:none}

  /* ---------- Filter ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .field label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px}
  .field input,.field select{
    width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;font-size:13px;
    background:#fff;color:var(--txt);outline:none;transition:.15s;font-family:inherit;
  }
  .field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.14)}

  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
  button{
    font-family:inherit;font-size:13px;font-weight:600;border-radius:10px;padding:10px 18px;
    border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand2)}
  .btn-ghost{background:#fff;border-color:#cbd5e1;color:#334155}
  .btn-ghost:hover{background:var(--soft)}
  .btn-ok{background:var(--ok);color:#fff}
  .btn-ok:hover{background:#047857}
  button:disabled{opacity:.5;cursor:not-allowed}

  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#334155;user-select:none;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--brand)}

  /* ---------- Stats ---------- */
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .pill{
    background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12.5px;color:#334155;
  }
  .pill b{color:var(--brand2)}

  /* ---------- Table ---------- */
  .tablebox{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  thead th{
    position:sticky;top:0;z-index:2;background:#0f172a;color:#fff;font-weight:600;
    padding:10px 12px;text-align:left;white-space:nowrap;border-right:1px solid #1e293b;
  }
  thead th:last-child{border-right:none}
  tbody td{padding:8px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap;color:#1e293b}
  tbody tr:nth-child(even) td{background:#fafbfc}
  tbody tr:hover td{background:#eff6ff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}
  .hidden{display:none !important}

  .toast{
    position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:11px;
    font-size:13px;box-shadow:0 12px 28px rgba(0,0,0,.3);opacity:0;transform:translateY(12px);
    transition:.25s;pointer-events:none;z-index:99;
  }
  .toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Filter &amp; Extract Excel — TAP 1 / TAP 2</h1>
    <p>Unggah file Excel, saring datanya, lalu unduh hasilnya sesuai template <b>TAP 1</b> atau <b>TAP 2</b>.</p>
  </header>

  <div class="tabs" id="tabsBar"></div>
  <div class="panel-wrap" id="tabPanels"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   1) KONFIGURASI TAB — TAP 1 & TAP 2
   ========================================================================= */
const TAP1_COLUMNS = [
  "No","Kode Perusahaan","Site","Nomor Dokumen","Nomor Referensi","Lokasi Tujuan",
  "Nik Tujuan","Tipe Transaksi","Status","Baris","Part","Deskripsi","Lot","Attribute",
  "Qty","Satuan","Conversion Qty","Conversion UM","Conversion Value","Nomor Permintaan",
  "Price Per Unit","Total Value","Mata Uang","Site Parent","Dibuat Oleh","Dibuat Pada",
  "Dikonfirmasi Oleh","Dikonfirmasi Pada","Diubah Oleh","Diubah Pada"
];

const TAP2_COLUMNS = [
  "No","Kode Perusahaan","Site","Nomor Dokumen","Nomor Referensi","Lokasi Tujuan",
  "NIK Tujuan","Tipe Transaksi","Status","Baris","Part","Deskripsi","Lot","Attribute",
  "Qty","Satuan","Conversion Qty","Conversion UM","Conversion Value","Nomor Permintaan",
  "Price Per Unit","Total Value","Mata Uang","Site Parent","Dibuat Oleh","Dibuat Pada",
  "Dikonfirmasi Oleh","Dikonfirmasi Pada","Diubah Oleh","Diubah Pada"
];

const NUMERIC_COLS = new Set(["Baris","Qty","Conversion Qty","Conversion Value","Price Per Unit","Total Value"]);
const DATE_COLS    = new Set(["Dibuat Pada","Dikonfirmasi Pada","Diubah Pada"]);
const MAX_PREVIEW_ROWS = 800;

const TAB_CONFIGS = {
  tap1: {
    label: "TAP 1",
    badge: "ASA19",
    exportTag: "TAP1",
    sheetPreferred: /tap\s*1/i,
    columns: TAP1_COLUMNS,
    /* TAP 1: "2026-10-12 00:00:00" */
    dateFormat: "datetime",
    datetimeSeparator: " "
  },
  tap2: {
    label: "TAP 2",
    badge: "INPUT DO",
    exportTag: "TAP2",
    sheetPreferred: /tap\s*2/i,
    columns: TAP2_COLUMNS,
    /* TAP 2: "16/10/2026" */
    dateFormat: "dmy"
  }
};

/* =========================================================================
   2) UTILITAS
   ========================================================================= */
const $ = id => document.getElementById(id);
const norm = s => String(s ?? "").replace(/\s+/g," ").trim().toLowerCase();

const escapeHtml = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escapeAttr = escapeHtml;

function pad2(n){ return String(n).padStart(2,"0"); }

function isoDate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

/** Ubah nilai apa pun menjadi "YYYY-MM-DD" untuk perbandingan filter tanggal. */
function toDateOnly(v){
  if (v instanceof Date) return isoDate(v);
  const s = String(v ?? "").trim();
  if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);          // YYYY-MM-DD
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);        // DD/MM/YYYY
  if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  const d = new Date(s);
  return isNaN(d) ? "" : isoDate(d);
}

/** Format nilai tanggal sesuai preferensi tab (datetime / dmy). */
function formatDateForTab(value, fmt){
  if (value === null || value === undefined || value === "") return "";
  if (fmt === "dmy"){
    let d = null;
    if (value instanceof Date) d = value;
    else {
      const s = String(value).trim();
      let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);   // sudah DD/MM/YYYY
      if (m) return `${pad2(m[1])}/${pad2(m[2])}/${m[3]}`;
      m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);              // dari ISO
      if (m) return `${m[3]}/${m[2]}/${m[1]}`;
      d = new Date(s);
      if (isNaN(d)) return s;
    }
    return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
  }
  // datetime: "YYYY-MM-DD HH:mm:ss"
  let d = null;
  if (value instanceof Date) d = value;
  else {
    const s = String(value).trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);     // dari DD/MM/YYYY
    if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])} 00:00:00`;
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);                // sudah ISO (mungkin sudah ada jam)
    if (m) return s.length >= 19 ? s.slice(0,19).replace("T"," ") : `${m[1]}-${m[2]}-${m[3]} 00:00:00`;
    d = new Date(s);
    if (isNaN(d)) return s;
  }
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ` +
         `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

function todayStamp(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
}

let toastTm;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTm);
  toastTm = setTimeout(() => t.classList.remove("show"), 2600);
}

/* =========================================================================
   3) TAB CONTROLLER
   ========================================================================= */
class TabController {
  constructor(tabId, cfg){
    this.tabId = tabId;
    this.cfg   = cfg;
    this.state = { wb:null, rows:[], filtered:[], baseName:"extract", sheetName:"" };
    this.mount();
    this.bind();
  }

  /* short-hands */
  el(suffix){ return document.getElementById(`${suffix}-${this.tabId}`); }

  /* --------------------------------------------------------------------
     Bangun panel HTML untuk tab ini
     -------------------------------------------------------------------- */
  mount(){
    const p = this.tabId;
    const cfg = this.cfg;
    const panel = document.createElement("div");
    panel.className = "tab-panel" + (p === "tap1" ? "" : " hidden");
    panel.id = `panel-${p}`;

    panel.innerHTML = `
      <section class="card">
        <h2>1. Unggah File Excel — ${cfg.label}</h2>
        <p class="sub">Format <code>.xlsx</code> / <code>.xls</code> / <code>.csv</code> — baris header dideteksi otomatis.</p>

        <label class="drop" id="drop-${p}" for="file-${p}">
          <div class="ico">📄</div>
          <b>Klik untuk memilih file, atau tarik &amp; lepas di sini</b>
          <span>File diproses sepenuhnya di browser Anda — tidak diunggah ke server.</span>
        </label>
        <input type="file" id="file-${p}" accept=".xlsx,.xls,.xlsm,.csv" />

        <div id="sheetBox-${p}" class="field hidden" style="margin-top:16px;max-width:340px">
          <label for="sheetSelect-${p}">Pilih Sheet</label>
          <select id="sheetSelect-${p}"></select>
        </div>
      </section>

      <section class="card hidden" id="filter-${p}">
        <h2>2. Filter Data — ${cfg.label}</h2>
        <p class="sub">Kosongkan kolom yang tidak ingin disaring.</p>

        <div class="grid">
          <div class="field" style="grid-column:span 2">
            <label for="fSearch-${p}">Pencarian Bebas (semua kolom)</label>
            <input type="text" id="fSearch-${p}" placeholder="Cth: KV-039602 / SVRMBKPG / TKR/PST" />
          </div>
          <div class="field"><label for="fKode-${p}">Kode Perusahaan</label><select id="fKode-${p}"></select></div>
          <div class="field"><label for="fSite-${p}">Site</label><select id="fSite-${p}"></select></div>
          <div class="field"><label for="fTipe-${p}">Tipe Transaksi</label><select id="fTipe-${p}"></select></div>
          <div class="field"><label for="fStatus-${p}">Status</label><select id="fStatus-${p}"></select></div>
          <div class="field"><label for="fLokasi-${p}">Lokasi Tujuan</label><select id="fLokasi-${p}"></select></div>
          <div class="field"><label for="fPart-${p}">Part</label><select id="fPart-${p}"></select></div>
          <div class="field"><label for="fRef-${p}">Nomor Referensi</label><input type="text" id="fRef-${p}" placeholder="Cth: TKR/PST/SV/26/10/112" /></div>
          <div class="field"><label for="fDari-${p}">Dibuat Pada (dari)</label><input type="date" id="fDari-${p}" /></div>
          <div class="field"><label for="fSampai-${p}">Dibuat Pada (sampai)</label><input type="date" id="fSampai-${p}" /></div>
        </div>

        <div class="actions">
          <button class="btn-ghost" id="btnReset-${p}">↺ Reset Filter</button>
          <label class="chk"><input type="checkbox" id="chkRenumber-${p}" checked /> Nomor ulang kolom "No"</label>
          <label class="chk"><input type="checkbox" id="chkBlank-${p}" checked /> Sertakan 3 baris kosong di atas header</label>
          <div style="flex:1"></div>
          <button class="btn-ok" id="btnExport-${p}">⬇ Download Excel (${cfg.label})</button>
        </div>
      </section>

      <section class="card hidden" id="preview-${p}">
        <h2>3. Pratinjau Hasil — ${cfg.label}</h2>
        <p class="sub">Tampilan di bawah ini sama dengan isi file yang akan diunduh.</p>

        <div class="stats">
          <div class="pill">Total baris: <b id="stTotal-${p}">0</b></div>
          <div class="pill">Setelah difilter: <b id="stFiltered-${p}">0</b></div>
          <div class="pill">Kolom: <b id="stCols-${p}">0</b></div>
        </div>

        <div class="tablebox">
          <table id="tbl-${p}">
            <thead><tr id="thead-${p}"></tr></thead>
            <tbody id="tbody-${p}"></tbody>
          </table>
          <div class="empty hidden" id="emptyMsg-${p}">Tidak ada baris yang cocok dengan filter.</div>
        </div>
        <p class="sub" id="limitNote-${p}" style="margin-top:10px"></p>
      </section>
    `;
    $("tabPanels").appendChild(panel);
  }

  /* --------------------------------------------------------------------
     Pasang event listener
     -------------------------------------------------------------------- */
  bind(){
    /* ---- upload ---- */
    const fileInput = this.el("file");
    fileInput.addEventListener("change", e => {
      const f = e.target.files[0];
      if (f) this.loadFile(f);
    });

    const drop = this.el("drop");
    ["dragenter","dragover"].forEach(ev =>
      drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); })
    );
    ["dragleave","drop"].forEach(ev =>
      drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); })
    );
    drop.addEventListener("drop", e => {
      const f = e.dataTransfer.files[0];
      if (f) this.loadFile(f);
    });

    /* ---- sheet selector ---- */
    this.el("sheetSelect").addEventListener("change", e => this.buildFromSheet(e.target.value));

    /* ---- filter inputs ---- */
    ["fSearch","fKode","fSite","fTipe","fStatus","fLokasi","fPart","fRef","fDari","fSampai"]
      .forEach(key => {
        const el = this.el(key);
        el.addEventListener("input",  () => this.applyFilter());
        el.addEventListener("change", () => this.applyFilter());
      });

    /* ---- actions ---- */
    this.el("btnReset").addEventListener("click", () => this.resetFilter());
    this.el("btnExport").addEventListener("click", () => this.exportExcel());
    this.el("chkRenumber").addEventListener("change", () => this.renderPreview());
  }

  /* --------------------------------------------------------------------
     Baca file Excel
     -------------------------------------------------------------------- */
  loadFile(file){
    this.state.baseName = file.name.replace(/\.(xlsx|xls|xlsm|csv)$/i,"");
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array", cellDates:true });
        this.state.wb = wb;

        /* isi dropdown sheet */
        const sel = this.el("sheetSelect");
        sel.innerHTML = "";
        wb.SheetNames.forEach(n => {
          const o = document.createElement("option");
          o.value = n; o.textContent = n;
          sel.appendChild(o);
        });

        /* pilih sheet sesuai preferensi tab, lalu fallback ke yang pertama */
        const preferred = wb.SheetNames.find(n => this.cfg.sheetPreferred.test(n));
        sel.value = preferred || wb.SheetNames[0];

        this.el("sheetBox").classList.remove("hidden");
        this.buildFromSheet(sel.value);
        toast(`[${this.cfg.label}] Berhasil membaca: ${file.name}`);
      }catch(err){
        console.error(err);
        toast("Gagal membaca file: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  /* --------------------------------------------------------------------
     Parse sheet → array of objects
     -------------------------------------------------------------------- */
  buildFromSheet(sheetName){
    const ws = this.state.wb.Sheets[sheetName];
    if (!ws) return;
    this.state.sheetName = sheetName;

    const aoa = XLSX.utils.sheet_to_json(ws, {
      header:1, raw:true, defval:null, blankrows:true
    });

    /* --- deteksi baris header --- */
    let headerIdx = -1;
    for (let i = 0; i < Math.min(aoa.length, 100); i++){
      const r = (aoa[i] || []).map(norm);
      if (r.includes("kode perusahaan") && r.includes("nomor dokumen")){ headerIdx = i; break; }
    }
    if (headerIdx === -1){
      let best = -1, bestScore = 0;
      for (let i = 0; i < Math.min(aoa.length, 100); i++){
        const r = (aoa[i] || []).map(norm);
        const score = this.cfg.columns.filter(c => r.includes(norm(c))).length;
        if (score > bestScore){ bestScore = score; best = i; }
      }
      if (bestScore >= 5) headerIdx = best;
    }
    if (headerIdx === -1){
      toast("Header tidak dikenali. Pastikan file memakai template yang sama.");
      return;
    }

    const headers = (aoa[headerIdx] || []).map(h => String(h ?? "").trim());

    /* --- peta kolom: nama → indeks (fallback ke posisi) --- */
    const colIdx = this.cfg.columns.map((col, i) => {
      const found = headers.findIndex(h => norm(h) === norm(col));
      return found !== -1 ? found : (i < headers.length ? i : -1);
    });

    /* --- ambil baris data --- */
    const rows = [];
    for (let r = headerIdx + 1; r < aoa.length; r++){
      const raw = aoa[r] || [];
      const isEmpty = raw.every(c => c === null || c === undefined || String(c).trim() === "");
      if (isEmpty) continue;

      const obj = {};
      this.cfg.columns.forEach((col, i) => {
        const src = colIdx[i];
        let v = src >= 0 ? raw[src] : null;

        if (DATE_COLS.has(col)){
          obj[col] = formatDateForTab(v, this.cfg.dateFormat);
          return;
        }
        if (v instanceof Date){ obj[col] = formatDateForTab(v, this.cfg.dateFormat); return; }
        if (v === null || v === undefined){ obj[col] = ""; return; }
        if (typeof v === "number"){ obj[col] = v; return; }
        obj[col] = String(v).trim();
      });

      /* buang baris kosong */
      if (!obj["Nomor Dokumen"] && !obj["Part"] && !obj["Nomor Referensi"]) continue;
      rows.push(obj);
    }

    this.state.rows = rows;
    this.buildFilterOptions();
    this.applyFilter();

    this.el("filter").classList.remove("hidden");
    this.el("preview").classList.remove("hidden");
  }

  /* --------------------------------------------------------------------
     Bangun dropdown filter
     -------------------------------------------------------------------- */
  buildFilterOptions(){
    const map = {
      fKode:"Kode Perusahaan", fSite:"Site", fTipe:"Tipe Transaksi",
      fStatus:"Status", fLokasi:"Lokasi Tujuan", fPart:"Part"
    };
    Object.entries(map).forEach(([key, col]) => {
      const sel = this.el(key);
      const current = sel.value;
      const vals = [...new Set(
        this.state.rows.map(r => String(r[col] ?? "").trim()).filter(Boolean)
      )].sort();
      sel.innerHTML = `<option value="">— Semua —</option>` +
        vals.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join("");
      if (vals.includes(current)) sel.value = current;
    });
  }

  /* --------------------------------------------------------------------
     Filter
     -------------------------------------------------------------------- */
  applyFilter(){
    const q      = norm(this.el("fSearch").value);
    const kode   = this.el("fKode").value;
    const site   = this.el("fSite").value;
    const tipe   = this.el("fTipe").value;
    const status = this.el("fStatus").value;
    const lokasi = this.el("fLokasi").value;
    const part   = this.el("fPart").value;
    const ref    = norm(this.el("fRef").value);
    const dari   = this.el("fDari").value;
    const sampai = this.el("fSampai").value;

    this.state.filtered = this.state.rows.filter(r => {
      if (kode   && String(r["Kode Perusahaan"]) !== kode)   return false;
      if (site   && String(r["Site"])            !== site)   return false;
      if (tipe   && String(r["Tipe Transaksi"])  !== tipe)   return false;
      if (status && String(r["Status"])          !== status) return false;
      if (lokasi && String(r["Lokasi Tujuan"])   !== lokasi) return false;
      if (part   && String(r["Part"])            !== part)   return false;
      if (ref    && !norm(r["Nomor Referensi"]).includes(ref)) return false;

      if (dari || sampai){
        const d = toDateOnly(r["Dibuat Pada"]);
        if (!d) return false;
        if (dari   && d < dari)   return false;
        if (sampai && d > sampai) return false;
      }
      if (q){
        const hay = this.cfg.columns.map(c => norm(r[c])).join(" | ");
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    this.renderPreview();
  }

  resetFilter(){
    ["fSearch","fRef","fDari","fSampai"].forEach(k => this.el(k).value = "");
    ["fKode","fSite","fTipe","fStatus","fLokasi","fPart"].forEach(k => this.el(k).value = "");
    this.applyFilter();
  }

  /* --------------------------------------------------------------------
     Pratinjau tabel
     -------------------------------------------------------------------- */
  renderPreview(){
    const thead = this.el("thead");
    const tbody = this.el("tbody");

    thead.innerHTML = this.cfg.columns.map(c =>
      `<th class="${NUMERIC_COLS.has(c) || c === "No" ? "num" : ""}">${escapeHtml(c)}</th>`
    ).join("");

    const renumber = this.el("chkRenumber").checked;
    const rows = this.state.filtered;
    const shown = rows.slice(0, MAX_PREVIEW_ROWS);

    tbody.innerHTML = shown.map((r, i) => {
      const cells = this.cfg.columns.map(col => {
        let v = col === "No" ? (renumber ? i + 1 : (r["No"] ?? "")) : r[col];
        const isNum = NUMERIC_COLS.has(col) || col === "No";
        return `<td class="${isNum ? "num" : ""}">${escapeHtml(v === "" || v === null || v === undefined ? "" : v)}</td>`;
      }).join("");
      return `<tr>${cells}</tr>`;
    }).join("");

    this.el("emptyMsg").classList.toggle("hidden", rows.length > 0);
    this.el("limitNote").textContent = rows.length > MAX_PREVIEW_ROWS
      ? `Pratinjau dibatasi ${MAX_PREVIEW_ROWS} baris pertama. Semua ${rows.length} baris tetap akan diekspor.`
      : "";

    this.el("stTotal").textContent    = this.state.rows.length.toLocaleString("id-ID");
    this.el("stFiltered").textContent = rows.length.toLocaleString("id-ID");
    this.el("stCols").textContent     = this.cfg.columns.length;
  }

  /* --------------------------------------------------------------------
     Export ke Excel
     -------------------------------------------------------------------- */
  exportExcel(){
    if (!this.state.rows.length){ toast("Belum ada data untuk diekspor."); return; }

    const renumber  = this.el("chkRenumber").checked;
    const withBlank = this.el("chkBlank").checked;

    const aoa = [];
    if (withBlank) aoa.push([], [], []);           // 3 baris kosong di atas header
    aoa.push(this.cfg.columns.slice());            // baris header

    this.state.filtered.forEach((r, i) => {
      aoa.push(this.cfg.columns.map(col => {
        if (col === "No") return renumber ? i + 1 : (r["No"] ?? "");
        const v = r[col];
        if (v === null || v === undefined || v === "") return "";
        if (NUMERIC_COLS.has(col) && typeof v === "number") return v;
        if (NUMERIC_COLS.has(col) && v !== "" && !isNaN(Number(v))) return Number(v);
        return v;
      }));
    });

    const ws = XLSX.utils.aoa_to_sheet(aoa);

    ws["!cols"] = this.cfg.columns.map(c => ({
      wch: Math.min(45, Math.max(11, c.length + 4))
    }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, this.cfg.label);

    const fname = `${this.state.baseName}_${this.cfg.exportTag}_${todayStamp()}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast(`[${this.cfg.label}] Berhasil diunduh: ${fname}`);
  }
}

/* =========================================================================
   4) INISIALISASI
   ========================================================================= */
const CONTROLLERS = {};

(function init(){
  /* --- buat tombol tab --- */
  const tabsBar = $("tabsBar");
  Object.entries(TAB_CONFIGS).forEach(([id, cfg]) => {
    const t = document.createElement("div");
    t.className = "tab" + (id === "tap1" ? " active" : "");
    t.dataset.tab = id;
    t.innerHTML = `${cfg.label}<span class="badge">${cfg.badge}</span>`;
    t.addEventListener("click", () => switchTab(id));
    tabsBar.appendChild(t);
  });

  /* --- buat controller untuk setiap tab --- */
  Object.entries(TAB_CONFIGS).forEach(([id, cfg]) => {
    CONTROLLERS[id] = new TabController(id, cfg);
  });
})();

function switchTab(tabId){
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tab === tabId)
  );
  document.querySelectorAll(".tab-panel").forEach(p =>
    p.classList.toggle("hidden", p.id !== `panel-${tabId}`)
  );
}
</script>
